<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product List Report</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
      background:white;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background: darkgreen;
      color: white;
    }
    tr:nth-child(even) {
      background: #f2f2f2;
    }
    .total {
      text-align: right;
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
    }
  .btn-container{
    display:flex;
    alugn-itens:center;
    justify-content:center;
  }
    .print-btn {
      margin-top: 20px;
      margin-left:auto;
      background:darkgreen;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 15px;
      cursor: pointer;
    }
    .print-btn:hover {
      background: green;
    }
  </style>
</head>
<body>
  <h2>Fatan Alheri spare parts lissafin shekara</h2>

  <table id="productTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Product Name</th>
        <th>Price (₦)</th>
        <th>Quantity</th>
        <th>Total (₦)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="total" id="grandTotal">Total: ₦0</div>
  <div class="btn-container">
  <button class="print-btn" onclick="window.print()">🖨️ Print List</button>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tableBody = document.querySelector('#productTable tbody');
      const totalDiv = document.getElementById('grandTotal');
      const products = JSON.parse(localStorage.getItem('products')) || [];

      let grandTotal = 0;
      tableBody.innerHTML = '';

      products.forEach((p, i) => {
        const total = p.price * p.quantity;
        grandTotal += total;

        const row = `
          <tr>
            <td>${i + 1}</td>
            <td>${p.name}</td>
            <td>₦${p.price}</td>
            <td>${p.quantity}</td>
            <td><b>₦${total}</b></td>
          </tr>
        `;
        tableBody.insertAdjacentHTML('beforeend', row);
      });

      totalDiv.textContent = `Total: ₦${grandTotal.toLocaleString()}`;
    });
  </script>
</body>
</html>
